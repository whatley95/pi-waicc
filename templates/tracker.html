<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAICC Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #dde2ea;
    --accent: #2f6fde; --live: #1f9d63; --warn: #b7791f; --bad: #c53b3b; --chip: #eef1f6;
    --needs: #fff6e5; --needs-line: #f0c36d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1a1f27; --ink: #e5e9f0; --muted: #98a2b3; --line: #2c3340;
      --accent: #6ea0ff; --live: #3ccf8e; --warn: #e3a948; --bad: #f07070; --chip: #242b36;
      --needs: #2a2416; --needs-line: #7a5d22;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; overflow-wrap: anywhere; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  button { font: inherit; background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  code { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--chip); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
  .needs { background: var(--needs); border: 1px solid var(--needs-line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .needs ul { margin: 6px 0 0; padding-left: 18px; }
  .needs li { margin: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
  .card { display: flex; flex-direction: column; justify-content: flex-start; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; min-width: 0; text-align: left; font: inherit; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .path { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { margin-top: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.live { background: var(--live); animation: pulse 1.6s infinite; }
  .dot.warn { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
  .steps { margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
  .steps li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .chip.attn { background: var(--needs); border: 1px solid var(--needs-line); }
  .badge { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .02em; background: var(--chip); }
  .badge.good { color: var(--live); } .badge.bad { color: var(--bad); } .badge.warn { color: var(--warn); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  details > summary { cursor: pointer; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .answer { white-space: pre-wrap; background: var(--chip); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 13px; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }
  .ok { color: var(--live); } .no { color: var(--bad); } .na { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>WAICC Tracker</h1>
    <span class="muted small" id="updated">Waiting for data…</span>
    <button id="pause" type="button">Pause</button>
  </header>
  <div id="app"><p class="empty">No WAICC activity yet. Start Pi in a project and this page fills in by itself.</p></div>
  <noscript><p class="empty">This page needs JavaScript to show your projects.</p></noscript>
</main>
<script>
(() => {
  "use strict";
  // WAICC rewrites data.js beside this page; loading it as a script works for a page opened from disk.
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const store = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch { /* not kept */ } } };
  let data = null, shown = "", paused = false;
  let selected = decodeURIComponent(location.hash.slice(1)) || store.get("waicc-selected") || "";
  const open = new Set(JSON.parse(store.get("waicc-open") || "[]"));

  const ago = (iso) => {
    const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`;
  };
  const dur = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${Math.floor(s / 3600)}h ${String(Math.floor(s / 60) % 60).padStart(2, "0")}m`;
  };
  const since = (ms) => `<span data-since="${ms}">${dur(Date.now() - ms)}</span>`;
  const stale = (p) => p.live.length && Date.now() - Date.parse(p.updatedAt) > 90_000;
  const tone = (status) => /READY_TO_CLOSE|PASS|PLAN_READY|SPEC_APPROVED|ADVICE_READY/.test(status) ? "good"
    : /BLOCKED|NEEDS_CHANGES|STALE/.test(status) ? "bad" : /NEEDS_|AWAITING|WAITING/.test(status) ? "warn" : "";
  const badge = (status) => `<span class="badge ${tone(status)}">${esc(String(status).replaceAll("_", " ").toLowerCase())}</span>`;
  const mark = (k) => (k === "rejected" ? "✗" : k === "waicc" ? "◆" : "›");

  function card(p) {
    const lead = p.sessions.find((s) => s.id === p.selectedSessionId) ?? p.sessions.find((s) => s.status !== "CLOSED");
    const openCount = p.sessions.filter((s) => s.status !== "CLOSED").length;
    const decisions = p.sessions.reduce((n, s) => n + (s.status === "CLOSED" ? 0 : s.decisions.filter((d) => d.status === "open" && d.owner !== "agent").length), 0);
    const tasks = lead?.tasks.length ? `<span class="chip">tasks ${lead.tasks.filter((t) => t.reported).length}/${lead.tasks.length} reported</span>` : "";
    let state;
    if (p.live.length) {
      state = p.live.map((run) => `<div><span class="dot ${stale(p) ? "warn" : "live"}"></span>${esc(run.label.replace(/^WAICC · /, ""))} · ${since(run.startedAt)}</div>
        <ul class="steps">${run.steps.slice(-2).map((s) => `<li>${mark(s.kind)} ${esc(s.text)}</li>`).join("")}</ul>`).join("");
      if (stale(p)) state += `<div class="small" style="color:var(--warn)">No update for ${ago(p.updatedAt).replace(" ago", "")}: Pi may have closed.</div>`;
    } else
      state = lead ? `<div><span class="dot"></span>${badge(lead.status)} <span class="small">${esc(lead.title)}</span></div><div class="small muted">idle · last activity ${ago(p.updatedAt)}</div>`
        : `<div class="small muted"><span class="dot"></span>No open session · ${ago(p.updatedAt)}</div>`;
    return `<button type="button" class="card${p.key === selected ? " selected" : ""}" data-key="${esc(p.key)}">
      <div class="name">${esc(p.name)}</div><div class="path" title="${esc(p.root)}">${esc(p.root)}</div>
      <div class="state">${state}</div>
      <div class="chips"><span class="chip">${openCount} open</span>${decisions ? `<span class="chip attn">${decisions} decision${decisions > 1 ? "s" : ""} for you</span>` : ""}${tasks}</div>
    </button>`;
  }

  const fold = (id, title, body, defaultOpen) => {
    const isOpen = open.has(id) || (defaultOpen && !open.has(`!${id}`));
    return `<details data-id="${esc(id)}"${isOpen ? " open" : ""}><summary>${title}</summary>${body}</details>`;
  };
  const checkMark = (o) => (o === "passed" ? `<span class="ok">passed</span>` : o === "failed" ? `<span class="no">failed</span>` : `<span class="na">not run</span>`);

  function session(p, s) {
    const decisions = s.decisions.length ? `<h3>Decisions</h3><div class="scroll"><table><tr><th>ID</th><th>Question</th><th>Owner</th><th>Status</th><th>Recommendation / answer</th></tr>
      ${s.decisions.map((d) => `<tr><td>${esc(d.id)}</td><td>${esc(d.question)}</td><td>${esc(d.owner)}</td><td>${d.status === "open" ? `<span class="badge warn">open</span>` : esc(d.status)}${d.risk ? ` <span class="small muted">${esc(d.risk)} risk</span>` : ""}</td><td>${d.answer ? `<b>${esc(d.answer)}</b>` : esc(d.recommendation)}</td></tr>`).join("")}</table></div>` : "";
    const tasks = s.tasks.length ? `<h3>Tasks</h3><div class="scroll"><table><tr><th>ID</th><th>Task</th><th>Reported done</th></tr>
      ${s.tasks.map((t) => `<tr><td>${esc(t.id)}</td><td>${esc(t.title)}</td><td>${t.reported ? `<span class="ok">✓ reported</span>` : `<span class="na">—</span>`}</td></tr>`).join("")}</table></div>
      <div class="small muted">"Reported" is the coding agent's claim in its latest whole-work report; review checks it.</div>` : "";
    const rounds = s.rounds.length ? `<h3>Timeline</h3><div class="scroll"><table><tr><th>#</th><th>Step</th><th>Agent</th><th>Result</th><th>Findings</th><th>Checks</th><th>Time</th></tr>
      ${s.rounds.map((r) => {
        const passed = r.checks.filter((c) => c.outcome === "passed").length, failed = r.checks.filter((c) => c.outcome === "failed").length;
        const step = r.mode === "review" ? `${r.kind ?? "contract"} review` : r.mode;
        const agent = r.dispatch ? `${esc(r.dispatch.via)}${r.dispatch.model ? ` ${esc(r.dispatch.model)}` : ""}${r.dispatch.effort ? ` <span class="muted">${esc(r.dispatch.effort)}</span>` : ""}` : `<span class="muted">manual</span>`;
        const result = r.decision ? badge(r.decision) : r.outcome ? badge(r.outcome) : badge(r.status);
        const more = [r.question && `<div><b>Question:</b> ${esc(r.question)}</div>`, r.summary && `<div><b>Reply:</b> ${esc(r.summary)}</div>`, r.rationale && `<div><b>Assessment:</b> ${esc(r.rationale)}</div>`,
          r.findings.length && `<div><b>Findings:</b><ul>${r.findings.map((f) => `<li><span class="badge ${/critical|high/.test(f.severity) ? "bad" : f.severity === "medium" ? "warn" : ""}">${esc(f.severity)}</span> ${esc(f.description)}</li>`).join("")}</ul></div>`,
          r.checks.length && `<div><b>Checks:</b><ul>${r.checks.map((c) => `<li>${checkMark(c.outcome)} ${esc(c.description)}</li>`).join("")}</ul></div>`].filter(Boolean).join("");
        return `<tr><td>${r.n}</td><td>${more ? fold(`${s.id}:${r.id}`, esc(step), `<div class="small">${more}</div>`, false) : esc(step)}</td><td>${agent}</td><td>${result}</td><td>${r.findingCount || ""}</td>
          <td>${r.checks.length ? `<span class="ok">${passed}</span>${failed ? ` / <span class="no">${failed} failed</span>` : ""}` : ""}</td><td class="small muted">${r.dispatch ? dur(r.dispatch.durationMs) : ""}</td></tr>`;
      }).join("")}</table></div>` : `<p class="small muted">No handoffs yet.</p>`;
    const requirements = s.requirements.length ? fold(`${s.id}:req`, `Requirements (${s.requirements.length})`, `<ul class="small">${s.requirements.map((r) => `<li><b>${esc(r.id)}</b> ${esc(r.text)}</li>`).join("")}</ul>`, false) : "";
    const head = `${badge(s.status)} <b>${esc(s.title)}</b> <span class="small muted">· ${esc(s.phase)} · contract v${s.contractVersion} · coding by ${esc(s.implementationOwner)} · ${ago(s.updatedAt)}${s.id === p.selectedSessionId ? " · selected in Pi" : ""}</span>`;
    return `<div class="panel">${fold(`${p.key}:${s.id}`, head, `<div class="small muted" style="margin-top:6px">Session <code>${esc(s.id)}</code></div>${requirements}${tasks}${decisions}${rounds}`, s.status !== "CLOSED")}</div>`;
  }

  function detail(p) {
    const live = p.live.map((run) => `<div class="panel"><div><span class="dot ${stale(p) ? "warn" : "live"}"></span><b>${esc(run.label.replace(/^WAICC · /, ""))}</b> · ${since(run.startedAt)} · ${run.steps.length} steps</div>
      <ul class="steps" style="margin-top:6px">${run.steps.slice(-12).map((s) => `<li>${dur(s.at).padStart(7)} ${mark(s.kind)} ${esc(s.text)}</li>`).join("")}</ul>
      ${run.said ? `<div class="answer">${esc(run.said)}</div>` : ""}</div>`).join("");
    const notices = p.notices.length ? `<div class="panel small">${p.notices.slice().reverse().map((n) => `<div class="${n.level === "info" ? "" : n.level === "warning" ? "" : "no"}">${n.level === "info" ? "ℹ" : "⚠"} ${esc(n.text)} <span class="muted">${ago(n.at)}</span></div>`).join("")}</div>` : "";
    const consults = p.consults.length ? `<h2>Advisor questions</h2>${p.consults.map((c) => `<div class="panel">${fold(`${p.key}:c:${c.id}`, `${esc(c.question)} <span class="small muted">· ${esc(c.via)}${c.model ? ` ${esc(c.model)}` : ""} · ${dur(c.durationMs)} · ${ago(c.finishedAt)}</span>`,
      c.answer ? `<div class="answer">${esc(c.answer)}</div>` : `<p class="small no">No answer.</p>`, false)}</div>`).join("")}` : "";
    return `<h2>${esc(p.name)} <span class="small muted">${esc(p.root)}</span></h2>
      ${live ? `<h3>Working now</h3>${live}` : ""}${notices}
      <h3>Sessions</h3>${p.sessions.length ? p.sessions.map((s) => session(p, s)).join("") : `<p class="small muted">No WAICC sessions in this project yet.</p>`}
      ${consults}`;
  }

  function render() {
    if (!data) return;
    // Working projects first, then those waiting on you, then the rest by last activity.
    const rank = (p) => (p.live.length ? 0 : p.needsYou.length ? 1 : 2);
    const projects = data.projects.slice().sort((a, b) => rank(a) - rank(b) || b.updatedAt.localeCompare(a.updatedAt));
    if (!projects.length) return;
    if (!projects.some((p) => p.key === selected)) selected = projects[0].key;
    const needs = projects.flatMap((p) => p.needsYou.map((n) => ({ ...n, project: p.name })));
    document.getElementById("app").innerHTML = `
      ${needs.length ? `<section class="needs"><b>Needs you (${needs.length})</b><ul>${needs.map((n) => `<li><b>${esc(n.project)}</b>: ${esc(n.text)}${n.detail ? ` <span class="muted">(${esc(n.detail)})</span>` : ""} <code>${esc(n.command)}</code></li>`).join("")}</ul></section>` : ""}
      <section class="grid">${projects.map(card).join("")}</section>
      <section>${detail(projects.find((p) => p.key === selected))}</section>`;
  }

  function tick() {
    for (const el of document.querySelectorAll("[data-since]")) el.textContent = dur(Date.now() - Number(el.dataset.since));
    if (data) document.getElementById("updated").textContent = `${data.projects.length} project${data.projects.length === 1 ? "" : "s"} · updated ${ago(data.generatedAt)}${paused ? " · paused" : ""}`;
  }

  window.waiccTracker = (next) => {
    if (paused || !next || !Array.isArray(next.projects)) return;
    data = next;
    if (next.generatedAt !== shown) { shown = next.generatedAt; render(); }
    tick();
  };
  let script = null;
  function load() {
    if (paused) return;
    script?.remove();
    script = document.createElement("script");
    script.src = `data.js?${Date.now()}`;
    document.body.appendChild(script);
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest(".card");
    if (!target) return;
    selected = target.dataset.key;
    store.set("waicc-selected", selected);
    history.replaceState(null, "", `#${encodeURIComponent(selected)}`);
    render();
  });
  document.addEventListener("toggle", (event) => {
    const id = event.target.dataset?.id;
    if (!id) return;
    // Remember both choices: folded open, and default-open sections folded shut.
    open.delete(id); open.delete(`!${id}`);
    open.add(event.target.open ? id : `!${id}`);
    store.set("waicc-open", JSON.stringify([...open]));
  }, true);
  document.getElementById("pause").addEventListener("click", (event) => {
    paused = !paused;
    event.target.textContent = paused ? "Resume" : "Pause";
    tick();
    if (!paused) load();
  });
  load();
  setInterval(load, 3000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
