name: Release

# Publishes to npm when a version tag such as v0.1.0 is pushed. Needs the NPM_TOKEN secret
# (an npm automation token); see docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm provenance: the package links back to this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y subversion bubblewrap
      - run: npm ci --ignore-scripts
      # prepack runs the full check and the build, so a failing test publishes nothing.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
