name: Release

# Publishes to npm when a version tag such as v0.2.0 is pushed, through npm trusted
# publishing (OIDC): no token is stored anywhere. See docs/RELEASING.md for the one-time setup.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # trusted publishing: npm checks this workflow run instead of a token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y subversion bubblewrap
      - run: npm ci --ignore-scripts
      # prepack runs the full check and the build, so a failing test publishes nothing.
      # Provenance is added automatically for a public package published this way.
      - run: npm publish --access public
