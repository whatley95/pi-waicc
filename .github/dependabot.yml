# Weekly update PRs; CI on all three systems decides whether each one is safe.
version: 2
updates:
  # Includes the pinned Pi, so the tests follow the Pi version people actually run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    # The types follow the oldest supported Node (engines), so code never uses a newer Node's APIs.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
